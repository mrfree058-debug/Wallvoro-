<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallvoro - Laptop & PC Wallpapers</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#07152f;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.95),transparent 26%),
    radial-gradient(circle at 82% 35%,rgba(255,255,255,.85),transparent 28%),
    radial-gradient(circle at 35% 82%,rgba(255,255,255,.8),transparent 30%),
    linear-gradient(135deg,#e5f8ff 0%,#b9e8fa 48%,#dff8ff 100%);
  min-height:100vh;
  overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
  width:100%;
  background:#0b122c;
  border-radius:0 0 28px 28px;
  padding:20px 18px 27px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,20,50,.25);
}

.logo{
  display:inline-block;
  color:#fff;
  font-size:clamp(40px,7vw,68px);
  font-weight:800;
  letter-spacing:-3px;
  padding:7px 28px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:17px;
}

.header-line{
  width:min(560px,72%);
  height:3px;
  background:#20a9ed;
  margin:17px auto 11px;
  border-radius:10px;
}

.subtitle{
  color:#fff;
  font-size:clamp(18px,3vw,28px);
  font-weight:500;
}

/* =========================
   MAIN CONTAINER
========================= */

.main{
  width:min(900px,92%);
  margin:0 auto;
  padding:38px 0 80px;
}

.section-title{
  text-align:center;
  color:#06391f;
  font-size:clamp(28px,5vw,45px);
  font-weight:800;
  margin-bottom:25px;
}

/* =========================
   SEARCH
========================= */

.search-box{
  width:100%;
  height:55px;
  display:flex;
  align-items:center;
  background:#fff;
  border:2px solid rgba(20,100,150,.15);
  border-radius:30px;
  padding:0 18px;
  box-shadow:0 5px 15px rgba(0,50,90,.10);
  margin-bottom:18px;
}

.search-icon{
  font-size:20px;
  color:#63758a;
  margin-right:12px;
}

.search-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:#07152f;
  font-size:16px;
}

.search-box input::placeholder{
  color:#7b8b9b;
}

.mic-button{
  border:0;
  background:transparent;
  color:#07152f;
  font-size:19px;
  cursor:pointer;
  padding:7px;
}

/* =========================
   CATEGORY SCROLL
========================= */

.categories-wrapper{
  width:100%;
  overflow:hidden;
  margin-bottom:22px;
}

.categories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 2px 12px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:0 0 auto;
  white-space:nowrap;
  border:2px solid rgba(20,100,150,.18);
  background:rgba(255,255,255,.82);
  color:#10213f;
  border-radius:24px;
  padding:10px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

.cat:hover{
  transform:translateY(-1px);
}

.cat.active{
  background:#0b122c;
  color:#fff;
  border-color:#0b122c;
}

/* =========================
   WALLPAPER FEED
========================= */

.wallpaper-feed{
  width:100%;
}

.wallpaper-item{
  width:100%;
  margin-bottom:38px;
}

.wallpaper-card{
  width:100%;
  padding:12px;
  background:rgba(255,255,255,.62);
  border:2px solid rgba(255,255,255,.95);
  border-radius:20px;
  box-shadow:0 8px 22px rgba(0,50,90,.12);
  cursor:pointer;
  transition:.2s ease;
}

.wallpaper-card:hover{
  transform:translateY(-2px);
}

.wallpaper-frame{
  width:100%;
  position:relative;
  overflow:hidden;
  background:#dcecf3;
  border:2px solid rgba(11,18,44,.14);
  border-radius:15px;
}

.ratio-169{
  aspect-ratio:16 / 9;
}

.ratio-1610{
  aspect-ratio:16 / 10;
}

.wallpaper-frame img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.ratio-label{
  position:absolute;
  top:12px;
  right:12px;
  padding:7px 11px;
  background:rgba(11,18,44,.9);
  color:#fff;
  border-radius:8px;
  font-size:13px;
  font-weight:800;
}

/* =========================
   SPONSOR
========================= */

.sponsor-box{
  width:100%;
  border-radius:20px;
  border:2px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.48);
  box-shadow:0 8px 22px rgba(0,50,90,.10);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sponsor-box.ratio-169{
  aspect-ratio:16 / 9;
}

.sponsor-box.ratio-1610{
  aspect-ratio:16 / 10;
}

.sponsor-content{
  text-align:center;
  color:#40566c;
}

.sponsor-content strong{
  display:block;
  font-size:18px;
  margin-bottom:7px;
}

.sponsor-content span{
  font-size:13px;
}

/* =========================
   FOOTER
========================= */

.footer{
  width:100%;
  min-height:190px;
  padding:40px 20px 30px;
  background:rgba(235,249,255,.72);
  border:2px solid rgba(255,255,255,.82);
  border-radius:28px 28px 0 0;
  box-shadow:0 -5px 20px rgba(0,50,90,.08);
  text-align:center;
}

.footer-line{
  width:min(500px,80%);
  height:2px;
  background:#172d62;
  margin:0 auto 22px;
}

.copyright{
  color:#10213f;
  font-size:15px;
  margin-bottom:25px;
}

.footer-nav{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:18px 28px;
}

.footer-nav a{
  color:#10213f;
  text-decoration:none;
  font-size:15px;
}

/* =========================
   5 SECOND CLICK AD
========================= */

.ad-overlay{
  position:fixed;
  inset:0;
  z-index:99999;
  background:rgba(5,10,25,.96);
  display:none;
  align-items:center;
  justify-content:center;
}

.ad-overlay.show{
  display:flex;
}

.ad-window{
  width:min(92%,850px);
  aspect-ratio:16 / 9;
  position:relative;
  background:#17213a;
  border:1px solid #52617b;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.ad-label{
  position:absolute;
  left:15px;
  top:13px;
  color:#bdc9da;
  font-size:12px;
}

.ad-text{
  font-size:clamp(20px,4vw,32px);
  font-weight:700;
}

.countdown{
  position:absolute;
  top:13px;
  right:13px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#0b122c;
  border:3px solid #20a9ed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
}

.close-ad{
  display:none;
  position:absolute;
  top:67px;
  right:15px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#0b122c;
  font-size:22px;
  font-weight:800;
  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    padding:19px 14px 25px;
  }

  .logo{
    font-size:36px;
    padding:7px 20px;
  }

  .main{
    width:94%;
    padding-top:30px;
  }

  .search-box{
    height:51px;
  }

  .wallpaper-card{
    padding:9px;
  }

  .wallpaper-item{
    margin-bottom:32px;
  }

  .sponsor-box{
    border-radius:18px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="logo">
    WALLVORO
  </div>

  <div class="header-line"></div>

  <div class="subtitle">
    Laptop &amp; PC Wallpapers
  </div>

</header>


<!-- MAIN -->

<main class="main">

  <h1 class="section-title">
    Explore Wallpapers
  </h1>


  <!-- SEARCH -->

  <div class="search-box">

    <span class="search-icon">⌕</span>

    <input
      id="searchInput"
      type="text"
      placeholder="Search laptop & PC wallpapers..."
    >

    <button
      class="mic-button"
      id="micButton"
      aria-label="Voice search"
      title="Voice search"
    >
      🎙
    </button>

  </div>


  <!-- CATEGORY HORIZONTAL SCROLL -->

  <div class="categories-wrapper">

    <div class="categories">

      <button class="cat active" data-filter="all">
        ALL
      </button>

      <button class="cat" data-filter="latest">
        LATEST
      </button>

      <button class="cat" data-filter="16:9">
        16:9
      </button>

      <button class="cat" data-filter="16:10">
        16:10
      </button>

      <button class="cat" data-filter="anime">
        ANIME
      </button>

      <button class="cat" data-filter="nature">
        NATURE
      </button>

      <button class="cat" data-filter="cars">
        CARS
      </button>

      <button class="cat" data-filter="dark">
        DARK
      </button>

      <button class="cat" data-filter="minimal">
        MINIMAL
      </button>

      <button class="cat" data-filter="space">
        SPACE
      </button>

      <button class="cat" data-filter="gaming">
        GAMING
      </button>

      <button class="cat" data-filter="abstract">
        ABSTRACT
      </button>

    </div>

  </div>


  <!-- WALLPAPERS -->

  <div
    class="wallpaper-feed"
    id="wallpaperFeed"
  ></div>

</main>


<!-- FOOTER -->

<footer class="footer">

  <div class="footer-line"></div>

  <div class="copyright">
    © 2026 Wallvoro. All Rights Reserved.
  </div>

  <nav class="footer-nav">

    <a href="index.html">Home</a>
    <a href="#">About Us</a>
    <a href="#">Contact Us</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">FAQ</a>

  </nav>

</footer>


<!-- 5 SECOND AD -->

<div
  class="ad-overlay"
  id="adOverlay"
>

  <div class="ad-window">

    <div class="ad-label">
      SPONSORED AD
    </div>

    <div class="ad-text">
      ADVERTISEMENT
    </div>

    <div
      class="countdown"
      id="countdown"
    >
      5
    </div>

    <button
      class="close-ad"
      id="closeAd"
    >
      ×
    </button>

  </div>

</div>


<script>

/* ==========================================
   WALLPAPER DATA

   ratio = 16:9 or 16:10
   category = wallpaper category
========================================== */

const wallpapers = [

  {
    image:"https://picsum.photos/1280/720?random=101",
    ratio:"16:9",
    category:"nature",
    latest:true
  },

  {
    image:"https://picsum.photos/1280/800?random=102",
    ratio:"16:10",
    category:"anime",
    latest:true
  },

  {
    image:"https://picsum.photos/1280/720?random=103",
    ratio:"16:9",
    category:"cars",
    latest:true
  },

  {
    image:"https://picsum.photos/1280/800?random=104",
    ratio:"16:10",
    category:"space",
    latest:true
  },

  {
    image:"https://picsum.photos/1280/720?random=105",
    ratio:"16:9",
    category:"gaming",
    latest:true
  },

  {
    image:"https://picsum.photos/1280/800?random=106",
    ratio:"16:10",
    category:"dark",
    latest:false
  },

  {
    image:"https://picsum.photos/1280/720?random=107",
    ratio:"16:9",
    category:"minimal",
    latest:false
  },

  {
    image:"https://picsum.photos/1280/800?random=108",
    ratio:"16:10",
    category:"abstract",
    latest:false
  },

  {
    image:"https://picsum.photos/1280/720?random=109",
    ratio:"16:9",
    category:"nature",
    latest:false
  }

];


const feed =
  document.getElementById("wallpaperFeed");

const searchInput =
  document.getElementById("searchInput");

const micButton =
  document.getElementById("micButton");

let currentFilter = "all";


/* ==========================================
   RENDER WALLPAPERS
========================================== */

function renderWallpapers(){

  feed.innerHTML = "";

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const filtered =
    wallpapers.filter(item => {

      const filterMatch =
        currentFilter === "all" ||
        currentFilter === item.ratio ||
        currentFilter === item.category ||
        (
          currentFilter === "latest" &&
          item.latest
        );

      const searchMatch =
        search === "" ||
        item.category.includes(search) ||
        item.ratio.includes(search);

      return filterMatch && searchMatch;
    });


  filtered.forEach((item,index) => {

    /* WALLPAPER */

    const wallpaperItem =
      document.createElement("div");

    wallpaperItem.className =
      "wallpaper-item";


    const card =
      document.createElement("div");

    card.className =
      "wallpaper-card";


    const frame =
      document.createElement("div");

    frame.className =
      "wallpaper-frame " +
      (
        item.ratio === "16:10"
        ? "ratio-1610"
        : "ratio-169"
      );


    const img =
      document.createElement("img");

    img.src =
      item.image;

    img.alt =
      "Wallvoro Laptop PC Wallpaper";


    const ratio =
      document.createElement("div");

    ratio.className =
      "ratio-label";

    ratio.textContent =
      item.ratio;


    frame.appendChild(img);
    frame.appendChild(ratio);

    card.appendChild(frame);

    wallpaperItem.appendChild(card);

    feed.appendChild(wallpaperItem);


    /* CLICK → 5 SECOND AD */

    card.addEventListener("click",() => {

      openAd(
        item.image,
        item.ratio
      );

    });


    /*
      EXACTLY 3 WALLPAPERS,
      THEN ONE SAME-RATIO SPONSOR BOX.
    */

    if(
      (index + 1) % 3 === 0 &&
      index !== filtered.length - 1
    ){

      const sponsorItem =
        document.createElement("div");

      sponsorItem.className =
        "wallpaper-item";


      const sponsor =
        document.createElement("div");

      sponsor.className =
        "sponsor-box " +
        (
          item.ratio === "16:10"
          ? "ratio-1610"
          : "ratio-169"
        );


      sponsor.innerHTML = `
        <div class="sponsor-content">
          <strong>SPONSORED</strong>
          <span>Advertisement</span>
        </div>
      `;


      sponsorItem.appendChild(sponsor);

      feed.appendChild(sponsorItem);

    }

  });

}


/* ==========================================
   CATEGORY BUTTONS
========================================== */

document
  .querySelectorAll(".cat")
  .forEach(button => {

    button.addEventListener("click",() => {

      document
        .querySelectorAll(".cat")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      currentFilter =
        button.dataset.filter;

      renderWallpapers();

    });

  });


/* ==========================================
   SEARCH
========================================== */

searchInput.addEventListener(
  "input",
  renderWallpapers
);


/* ==========================================
   MICROPHONE SEARCH
========================================== */

micButton.addEventListener(
  "click",
  () => {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){

      alert(
        "Voice search is not supported in this browser."
      );

      return;
    }

    const recognition =
      new SpeechRecognition();

    recognition.lang =
      "en-IN";

    recognition.interimResults =
      false;

    recognition.start();


    recognition.onresult =
      function(event){

        const text =
          event.results[0][0].transcript;

        searchInput.value =
          text;

        renderWallpapers();

      };

  }
);


/* ==========================================
   5 SECOND AD
========================================== */

const adOverlay =
  document.getElementById("adOverlay");

const countdown =
  document.getElementById("countdown");

const closeAd =
  document.getElementById("closeAd");

let destination = "";


function openAd(image,ratio){

  destination =
    "wallpaper-detail.html" +
    "?device=desktop" +
    "&ratio=" +
    encodeURIComponent(ratio) +
    "&image=" +
    encodeURIComponent(image);


  adOverlay.classList.add("show");

  closeAd.style.display =
    "none";

  let seconds = 5;

  countdown.textContent =
    seconds;


  const timer =
    setInterval(() => {

      seconds--;

      if(seconds > 0){

        countdown.textContent =
          seconds;

      }else{

        clearInterval(timer);

        countdown.textContent =
          "✓";

        closeAd.style.display =
          "flex";

      }

    },1000);

}


/* ==========================================
   CLOSE AD → DETAILS PAGE
========================================== */

closeAd.addEventListener(
  "click",
  () => {

    adOverlay.classList.remove("show");

    if(destination){

      window.location.href =
        destination;

    }

  }
);


/* ==========================================
   FIRST LOAD
========================================== */

renderWallpapers();

</script>

</body>
  </html>
