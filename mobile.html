<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mobile Wallpapers - Wallvoro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #07152f;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95), transparent 25%),
        radial-gradient(circle at 85% 35%, rgba(255,255,255,0.85), transparent 28%),
        radial-gradient(circle at 35% 80%, rgba(255,255,255,0.80), transparent 30%),
        linear-gradient(135deg, #e5f8ff 0%, #b9e8fa 48%, #dff8ff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================== */

    .navbar {
      width: 100%;
      min-height: 145px;
      background: #0b122c;
      border-radius: 0 0 24px 24px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 20px 15px;

      box-shadow: 0 7px 22px rgba(0, 20, 50, 0.25);
    }

    .logo {
      color: #ffffff;
      text-decoration: none;

      font-size: clamp(38px, 7vw, 65px);
      font-weight: 800;

      letter-spacing: -2px;
      line-height: 1;
    }

    .header-line {
      width: min(400px, 60%);
      height: 2px;

      background: #20a9ed;

      margin: 12px auto 8px;

      position: relative;
    }

    .header-line::before,
    .header-line::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #20a9ed;

      top: 50%;
      transform: translateY(-50%);
    }

    .header-line::before {
      left: -3px;
    }

    .header-line::after {
      right: -3px;
    }

    .tagline {
      color: #ffffff;

      font-size: clamp(14px, 2.5vw, 21px);

      text-align: center;
    }


    /* =========================
       SEARCH
    ========================== */

    .search-container {
      width: 100%;
      padding: 28px 18px 18px;
    }

    .search-box {
      width: min(650px, 100%);
      height: 54px;

      margin: auto;

      display: flex;
      align-items: center;

      background: rgba(255,255,255,0.88);

      border: 2px solid rgba(255,255,255,0.95);

      border-radius: 30px;

      box-shadow:
        0 5px 16px rgba(0,70,130,0.12),
        inset 0 2px 7px rgba(255,255,255,0.95);

      padding: 0 16px;
    }

    .search-icon {
      font-size: 20px;
      margin-right: 12px;
    }

    .search-box input {
      flex: 1;

      border: none;
      outline: none;

      background: transparent;

      font-size: 16px;

      color: #07152f;
    }

    .search-box input::placeholder {
      color: #718096;
    }

    .mic-icon {
      font-size: 19px;
      cursor: pointer;
      margin-left: 10px;
    }


    /* =========================
       CATEGORIES
    ========================== */

    .categories-wrapper {
      width: 100%;
      padding: 5px 0 22px;
    }

    .categories-scroll {
      display: flex;

      gap: 10px;

      overflow-x: auto;

      padding: 5px 18px 10px;

      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex: 0 0 auto;

      border: 1px solid rgba(0,100,180,0.25);

      background: rgba(255,255,255,0.82);

      color: #07152f;

      border-radius: 22px;

      padding: 10px 18px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .cat-pill.active {
      background: #147fbe;
      color: white;

      border-color: #147fbe;
    }

    .cat-pill:hover {
      transform: translateY(-1px);
    }


    /* =========================
       AD BANNER
    ========================== */

    .ad-container {
      width: min(900px, 94%);

      margin: 0 auto 28px;
    }

    .banner-ad {
      height: 90px;
    }

    .ad-box {
      width: 100%;
      height: 100%;

      border-radius: 18px;

      background: rgba(240,250,255,0.75);

      border: 1px solid rgba(255,255,255,0.95);

      box-shadow: 0 4px 15px rgba(0,60,110,0.10);

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .ad-tag {
      font-size: 10px;
      letter-spacing: 1px;

      color: #6b7280;

      margin-bottom: 5px;
    }

    .ad-box p {
      font-size: 14px;
      color: #526276;
    }


    /* =========================
       WALLPAPER GRID
    ========================== */

    .container {
      width: min(1100px, 94%);

      margin: 0 auto;

      padding-bottom: 70px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 18px;
    }

    .card {
      display: block;

      background: rgba(255,255,255,0.82);

      border-radius: 18px;

      padding: 7px;

      text-decoration: none;

      border: 1px solid rgba(255,255,255,0.95);

      box-shadow:
        0 5px 16px rgba(0,65,120,0.12);

      overflow: hidden;

      transition: 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 9px 20px rgba(0,65,120,0.18);
    }

    .card img {
      display: block;

      width: 100%;

      /*
        MOBILE WALLPAPER RATIO
        Portrait / Phone Size
      */

      aspect-ratio: 9 / 16;

      object-fit: cover;

      border-radius: 13px;
    }


    /* =========================
       GRID AD
    ========================== */

    .ad-card {
      min-height: 260px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      background: rgba(235,248,255,0.72);
    }

    .ad-content {
      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 10px;
    }

    .ad-icon {
      font-size: 38px;
      color: #147fbe;
    }

    .ad-content p {
      font-size: 14px;
      color: #526276;
    }


    /* =========================
       FOOTER
    ========================== */

    footer {
      width: 100%;

      min-height: 180px;

      padding: 35px 20px 28px;

      background: rgba(235,249,255,0.72);

      border-top: 2px solid rgba(255,255,255,0.85);

      box-shadow:
        0 -5px 20px rgba(0,50,90,0.08);

      text-align: center;
    }

    .footer-links {
      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      gap: 10px 20px;

      margin-bottom: 22px;
    }

    .footer-links a {
      color: #10213f;

      text-decoration: none;

      font-size: 15px;
    }

    .footer-links a:hover {
      color: #147fbe;
    }

    footer p {
      color: #10213f;

      font-size: 14px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .navbar {
        min-height: 125px;
        padding: 18px 12px;
        border-radius: 0 0 20px 20px;
      }

      .logo {
        font-size: 42px;
      }

      .header-line {
        width: 55%;
        margin: 9px auto 7px;
      }

      .tagline {
        font-size: 14px;
      }

      .search-container {
        padding: 22px 15px 14px;
      }

      .search-box {
        height: 50px;
      }

      .categories-scroll {
        padding-left: 15px;
        padding-right: 15px;
      }

      .cat-pill {
        padding: 9px 15px;
        font-size: 13px;
      }

      .banner-ad {
        height: 78px;
      }

      .grid {
        gap: 12px;
      }

      .card {
        padding: 5px;
        border-radius: 14px;
      }

      .card img {
        border-radius: 10px;
      }

      .ad-card {
        min-height: 220px;
      }

      .footer-links {
        gap: 12px 18px;
      }
    }


    /* =========================
       VERY SMALL MOBILE
    ========================== */

    @media (max-width: 380px) {

      .logo {
        font-size: 37px;
      }

      .tagline {
        font-size: 12px;
      }

      .grid {
        gap: 9px;
      }

      .card {
        padding: 4px;
      }

      .cat-pill {
        padding: 8px 13px;
      }
    }

  </style>
</head>

  <!-- =========================
       SEARCH + CATEGORY SCRIPT
  ========================== -->

  <script>

    const searchInput =
      document.getElementById("searchInput");

    const wallpapers =
      document.querySelectorAll(".wallpaper");

    const categoryButtons =
      document.querySelectorAll(".cat-pill");


    let selectedCategory = "all";


    function filterWallpapers() {

      const searchText =
        searchInput.value.toLowerCase().trim();


      wallpapers.forEach(function(card) {

        const name =
          card.dataset.name.toLowerCase();

        const categories =
          card.dataset.category.toLowerCase();


        const matchesSearch =
          name.includes(searchText) ||
          categories.includes(searchText);


        const matchesCategory =
          selectedCategory === "all" ||
          categories.includes(selectedCategory);


        if (matchesSearch && matchesCategory) {

          card.style.display = "block";

        } else {

          card.style.display = "none";

        }

      });

    }


    searchInput.addEventListener(
      "input",
      filterWallpapers
    );


    categoryButtons.forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          categoryButtons.forEach(function(btn) {

            btn.classList.remove("active");

          });


          this.classList.add("active");


          selectedCategory =
            this.dataset.category;


          filterWallpapers();

        }
      );

    });


    /* =========================
       MICROPHONE
    ========================== */

    const micBtn =
      document.getElementById("micBtn");


    micBtn.addEventListener(
      "click",
      function() {

        if (
          !("webkitSpeechRecognition" in window)
        ) {

          alert(
            "Voice search is not supported in this browser."
          );

          return;

        }


        const recognition =
          new webkitSpeechRecognition();


        recognition.lang = "en-IN";

        recognition.start();


        recognition.onresult =
          function(event) {

            searchInput.value =
              event.results[0][0].transcript;

            filterWallpapers();

          };

      }
    );

  </script>
