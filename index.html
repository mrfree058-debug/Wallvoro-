<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wallvoro - Premium Wallpapers</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #07152f;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95), transparent 25%),
        radial-gradient(circle at 85% 35%, rgba(255,255,255,0.85), transparent 28%),
        radial-gradient(circle at 35% 80%, rgba(255,255,255,0.80), transparent 30%),
        linear-gradient(135deg, #e5f8ff 0%, #b9e8fa 48%, #dff8ff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      width: 100%;
      min-height: 275px;
      background: #0b122c;
      border-radius: 0 0 30px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px 38px;
      box-shadow: 0 8px 25px rgba(0, 20, 50, 0.25);
    }

    .logo {
      color: #ffffff;
      font-size: clamp(55px, 9vw, 100px);
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
      text-align: center;
    }

    .header-line {
      width: min(620px, 70%);
      height: 3px;
      background: #20a9ed;
      margin: 23px auto 12px;
      position: relative;
    }

    .header-line::before,
    .header-line::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #20a9ed;
      top: 50%;
      transform: translateY(-50%);
    }

    .header-line::before {
      left: -5px;
    }

    .header-line::after {
      right: -5px;
    }

    .tagline {
      color: #ffffff;
      font-size: clamp(18px, 2.7vw, 29px);
      text-align: center;
      font-weight: 400;
    }

    /* =========================
       MAIN
    ========================== */

    .main {
      width: 100%;
      padding: 145px 20px 130px;
    }

    .section-title {
      text-align: center;
      color: #06391f;
      font-size: clamp(38px, 6vw, 66px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .decorative-line {
      width: min(545px, 60%);
      height: 2px;
      background: #06391f;
      margin: 30px auto 70px;
      position: relative;
    }

    .decorative-line::before,
    .decorative-line::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: #06391f;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
    }

    .decorative-line::before {
      left: 48%;
    }

    .decorative-line::after {
      left: 52%;
    }

    /* =========================
       DEVICE BUTTONS
    ========================== */

    .device-container {
      width: min(680px, 82%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 42px;
    }

    .device-button {
      width: 100%;
      height: 105px;
      border-radius: 55px;

      border: 2px solid rgba(255,255,255,0.95);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.62),
          rgba(190,225,250,0.42)
        );

      box-shadow:
        0 0 0 2px rgba(55,145,255,0.38),
        0 6px 15px rgba(0,85,160,0.18),
        inset 0 2px 8px rgba(255,255,255,0.95),
        inset 0 -5px 12px rgba(75,160,235,0.12);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 58px;
      padding: 12px 35px;

      color: #07152f;
      text-decoration: none;

      font-size: clamp(24px, 3.4vw, 38px);
      font-weight: 700;

      cursor: pointer;
      transition: 0.25s ease;
    }

    .device-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 0 0 3px rgba(40,135,255,0.50),
        0 10px 20px rgba(0,85,160,0.20),
        inset 0 2px 9px rgba(255,255,255,1);
    }

    .device-button:active {
      transform: scale(0.98);
    }

    .device-icon {
      width: 52px;
      min-width: 52px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .device-icon svg {
      width: 100%;
      height: 100%;
      stroke: #07152f;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .device-name {
      min-width: 250px;
      text-align: left;
    }

    /* =========================
       FOOTER
    ========================== */

    .footer {
      width: 100%;
      min-height: 190px;

      padding: 40px 30px 30px;

      border-radius: 28px 28px 0 0;

      background: rgba(235,249,255,0.65);

      border: 2px solid rgba(255,255,255,0.82);

      box-shadow:
        0 -5px 20px rgba(0,50,90,0.08);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .copyright-row {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 35px;

      margin-bottom: 38px;
    }

    .footer-line {
      height: 2px;
      flex: 1;
      max-width: 230px;
      background: #172d62;
      position: relative;
    }

    .footer-line::after {
      content: "";

      position: absolute;
      right: -5px;
      top: 50%;

      width: 10px;
      height: 10px;

      background: #172d62;

      transform: translateY(-50%) rotate(45deg);
    }

    .copyright {
      color: #10213f;
      font-size: clamp(15px, 2vw, 23px);
      text-align: center;
      white-space: nowrap;
    }

    .footer-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 30px;
    }

    .footer-nav a {
      color: #10213f;
      text-decoration: none;

      font-size: clamp(15px, 2vw, 22px);

      transition: 0.2s ease;
    }

    .footer-nav a:hover {
      color: #147fbe;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 700px) {

      .header {
        min-height: 210px;
        padding: 28px 15px 30px;
        border-radius: 0 0 24px 24px;
      }

      .logo {
        letter-spacing: -2px;
      }

      .header-line {
        margin-top: 18px;
        margin-bottom: 10px;
      }

      .main {
        padding: 85px 15px 100px;
      }

      .section-title {
        font-size: clamp(32px, 8.5vw, 48px);
      }

      .decorative-line {
        width: 60%;
        margin: 27px auto 55px;
      }

      .device-container {
        width: 90%;
        gap: 30px;
      }

      .device-button {
        height: 88px;
        border-radius: 48px;

        gap: 25px;
        padding: 10px 22px;

        font-size: 22px;
      }

      .device-icon {
        width: 43px;
        min-width: 43px;
        height: 48px;
      }

      .device-name {
        min-width: 0;
        flex: 1;
        text-align: center;
      }

      .footer {
        padding: 34px 15px 25px;
        border-radius: 24px 24px 0 0;
      }

      .copyright-row {
        gap: 12px;
        margin-bottom: 28px;
      }

      .copyright {
        white-space: normal;
        font-size: 14px;
      }

      .footer-nav {
        gap: 18px 24px;
      }

      .footer-nav a {
        font-size: 15px;
      }
    }

    @media (max-width: 420px) {

      .device-container {
        width: 92%;
      }

      .device-button {
        height: 82px;
        gap: 15px;
        padding: 8px 18px;
      }

      .device-icon {
        width: 39px;
        min-width: 39px;
        height: 44px;
      }

      .device-name {
        font-size: 20px;
      }

      .footer-line {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      Wallvoro
    </div>

    <div class="header-line"></div>

    <div class="tagline">
      Premium Wallpapers for Every Screen Device
    </div>

  </header>


  <!-- MAIN CONTENT -->

  <main class="main">

    <h1 class="section-title">
      CHOOSE YOUR DEVICE
    </h1>

    <div class="decorative-line"></div>


    <div class="device-container">

      <!-- MOBILE -->

      <a href="mobile.html" class="device-button">

        <div class="device-icon">

          <svg viewBox="0 0 64 64">
            <rect x="18" y="6" width="28" height="52" rx="4"></rect>
            <line x1="27" y1="11" x2="37" y2="11"></line>
            <line x1="29" y1="51" x2="35" y2="51"></line>
          </svg>

        </div>

        <div class="device-name">
          MOBILE
        </div>

      </a>


      <!-- LAPTOP -->

      <a href="#" class="device-button">

        <div class="device-icon">

          <svg viewBox="0 0 64 64">
            <rect x="10" y="8" width="44" height="34" rx="2"></rect>
            <path d="M4 48h56"></path>
            <path d="M12 48l3 7h34l3-7"></path>
          </svg>

        </div>

        <div class="device-name">
          LAPTOP
        </div>

      </a>


      <!-- PC -->

      <a href="#" class="device-button">

        <div class="device-icon">

          <svg viewBox="0 0 64 64">
            <rect x="9" y="8" width="46" height="34" rx="2"></rect>
            <line x1="32" y1="42" x2="32" y2="53"></line>
            <line x1="21" y1="56" x2="43" y2="56"></line>
            <line x1="26" y1="53" x2="38" y2="53"></line>
          </svg>

        </div>

        <div class="device-name">
          PC - COMPUTER
        </div>

      </a>

    </div>

  </main>


  <!-- FOOTER -->

  <footer class="footer">

    <div class="copyright-row">

      <div class="footer-line"></div>

      <div class="copyright">
        © 2026 Wallvoro. All Rights Reserved.
      </div>

      <div class="footer-line"></div>

    </div>


    <nav class="footer-nav">

      <a href="#">Home</a>

      <a href="#">About Us</a>

      <a href="#">Contact Us</a>

      <a href="#">Privacy Policy</a>

      <a href="#">Terms of Service</a>

      <a href="#">FAQ</a>

    </nav>

  </footer>

</body>
</html>
