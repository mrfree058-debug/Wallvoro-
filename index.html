<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wallvoro - Premium Wallpapers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #0B122C;

            /*
             * Liquid Silk / Abstract Fabric Background
             */
            background:
                radial-gradient(
                    ellipse at 15% 25%,
                    rgba(255, 255, 255, 0.95) 0%,
                    rgba(255, 255, 255, 0) 35%
                ),
                radial-gradient(
                    ellipse at 85% 35%,
                    rgba(185, 229, 242, 0.95) 0%,
                    rgba(185, 229, 242, 0) 40%
                ),
                radial-gradient(
                    ellipse at 35% 75%,
                    rgba(221, 245, 250, 0.95) 0%,
                    rgba(221, 245, 250, 0) 45%
                ),
                linear-gradient(
                    135deg,
                    #EAFBFD 0%,
                    #B9E5F2 30%,
                    #DDF5FA 55%,
                    #8BC6DF 100%
                );

            background-attachment: fixed;
        }

        /*
         * HEADER
         */
        .header {
            width: 100%;
            background: #0B122C;
            border-radius: 0 0 28px 28px;
            padding: 28px 20px 32px;
            text-align: center;
            box-shadow: 0 8px 22px rgba(11, 18, 44, 0.22);
        }

        .logo {
            color: #FFFFFF;
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
        }

        .tagline-line {
            width: min(610px, 72%);
            height: 2px;
            margin: 22px auto 12px;

            background: #2E9FD0;

            position: relative;
        }

        .tagline-line::before,
        .tagline-line::after {
            content: "";
            position: absolute;
            top: 50%;

            width: 8px;
            height: 8px;

            background: #2E9FD0;
            transform: translateY(-50%) rotate(45deg);
        }

        .tagline-line::before {
            left: -3px;
        }

        .tagline-line::after {
            right: -3px;
        }

        .tagline {
            color: #FFFFFF;
            font-size: clamp(17px, 2.5vw, 25px);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /*
         * MAIN SECTION
         */
        .main {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;

            padding: 75px 24px 40px;
        }

        .device-title {
            text-align: center;

            color: #075B2A;

            font-size: clamp(34px, 6vw, 62px);
            font-weight: 800;

            letter-spacing: 0.5px;
        }

        /*
         * Decorative line below title
         */
        .title-decoration {
            width: min(550px, 60%);
            height: 2px;

            background: #075B2A;

            margin: 30px auto 70px;

            position: relative;
        }

        .title-decoration::before,
        .title-decoration::after {
            content: "";

            position: absolute;
            top: 50%;

            width: 11px;
            height: 11px;

            background: #075B2A;

            transform: translateY(-50%) rotate(45deg);
        }

        .title-decoration::before {
            left: 50%;
            margin-left: -12px;
        }

        .title-decoration::after {
            left: 50%;
            margin-left: 3px;
        }

        /*
         * DEVICE BUTTONS
         */
        .device-list {
            width: min(720px, 88%);
            margin: 0 auto;

            display: flex;
            flex-direction: column;

            gap: 28px;
        }

        .device-button {
            width: 100%;
            height: 108px;

            border-radius: 54px;

            border: 2px solid rgba(255, 255, 255, 0.85);

            background: rgba(255, 255, 255, 0.28);

            box-shadow:
                inset 0 2px 7px rgba(255, 255, 255, 0.80),
                inset 0 -4px 10px rgba(79, 159, 193, 0.18),
                0 7px 18px rgba(79, 159, 193, 0.18);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            display: flex;
            align-items: center;

            padding: 0 55px;

            color: #0B122C;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .device-button:hover {
            transform: translateY(-3px);

            box-shadow:
                inset 0 2px 7px rgba(255, 255, 255, 0.90),
                inset 0 -4px 10px rgba(79, 159, 193, 0.22),
                0 11px 24px rgba(79, 159, 193, 0.24);
        }

        .device-button:active {
            transform: scale(0.985);
        }

        /*
         * DEVICE ICON
         */
        .device-icon {
            width: 75px;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;
        }

        .device-icon svg {
            width: 52px;
            height: 52px;

            stroke: #0B122C;
            fill: none;

            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /*
         * DEVICE NAME
         */
        .device-name {
            flex: 1;

            text-align: center;

            font-size: clamp(25px, 4vw, 38px);
            font-weight: 800;

            color: #0B122C;

            letter-spacing: 0.5px;
        }

        /*
         * FOOTER
         */
        .footer {
            width: 100%;

            padding: 65px 24px 32px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;

            color: #0B122C;

            font-size: 17px;
            font-weight: 500;

            text-align: center;
        }

        .footer-line {
            width: min(190px, 18vw);
            height: 2px;

            background: #0B122C;

            position: relative;
        }

        .footer-line::after {
            content: "";

            position: absolute;

            top: 50%;
            right: -2px;

            width: 9px;
            height: 9px;

            background: #0B122C;

            transform: translateY(-50%) rotate(45deg);
        }

        .footer-line.left::after {
            right: auto;
            left: -2px;
        }

        /*
         * MOBILE RESPONSIVE
         */
        @media (max-width: 700px) {

            .header {
                padding: 25px 15px 28px;
                border-radius: 0 0 22px 22px;
            }

            .logo {
                font-size: 46px;
                letter-spacing: -1px;
            }

            .tagline-line {
                width: 78%;
                margin-top: 17px;
                margin-bottom: 10px;
            }

            .tagline {
                font-size: 16px;
            }

            .main {
                padding: 55px 16px 30px;
            }

            .device-title {
                font-size: 34px;
                line-height: 1.15;
            }

            .title-decoration {
                width: 58%;
                margin: 24px auto 48px;
            }

            .device-list {
                width: 94%;
                gap: 20px;
            }

            .device-button {
                height: 82px;
                border-radius: 41px;
                padding: 0 25px;
            }

            .device-icon {
                width: 55px;
            }

            .device-icon svg {
                width: 42px;
                height: 42px;
            }

            .device-name {
                font-size: 25px;
            }

            .footer {
                padding-top: 55px;
                gap: 12px;
                font-size: 13px;
            }

            .footer-line {
                width: 15vw;
            }
        }

        @media (max-width: 420px) {

            .logo {
                font-size: 40px;
            }

            .tagline {
                font-size: 14px;
            }

            .device-title {
                font-size: 29px;
            }

            .device-button {
                height: 74px;
                padding: 0 18px;
            }

            .device-icon {
                width: 48px;
            }

            .device-icon svg {
                width: 36px;
                height: 36px;
            }

            .device-name {
                font-size: 22px;
            }

            .footer {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            Wallvoro
        </div>

        <div class="tagline-line"></div>

        <div class="tagline">
            Premium Wallpapers for Every Screen Device
        </div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <h1 class="device-title">
            CHOOSE YOUR DEVICE
        </h1>

        <div class="title-decoration"></div>


        <div class="device-list">

            <!-- MOBILE -->
            <button
                class="device-button"
                type="button"
                onclick="selectDevice('mobile')"
            >

                <span class="device-icon">

                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="18" y="6" width="28" height="52" rx="5"></rect>
                        <line x1="27" y1="11" x2="37" y2="11"></line>
                        <circle cx="32" cy="51" r="1.5"></circle>
                    </svg>

                </span>

                <span class="device-name">
                    MOBILE
                </span>

            </button>


            <!-- LAPTOP -->
            <button
                class="device-button"
                type="button"
                onclick="selectDevice('laptop')"
            >

                <span class="device-icon">

                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="11" y="9" width="42" height="31" rx="2"></rect>
                        <path d="M5 47h54"></path>
                        <path d="M13 40l-4 7"></path>
                        <path d="M51 40l4 7"></path>
                    </svg>

                </span>

                <span class="device-name">
                    LAPTOP
                </span>

            </button>


            <!-- PC -->
            <button
                class="device-button"
                type="button"
                onclick="selectDevice('pc')"
            >

                <span class="device-icon">

                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="9" y="8" width="46" height="34" rx="2"></rect>
                        <path d="M32 42v11"></path>
                        <path d="M22 55h20"></path>
                    </svg>

                </span>

                <span class="device-name">
                    PC - COMPUTER
                </span>

            </button>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <span class="footer-line left"></span>

        <span>
            © 2026 Wallvoro. All Rights Reserved.
        </span>

        <span class="footer-line"></span>

    </footer>


    <!-- BUTTON FUNCTION -->
    <script>

        function selectDevice(device) {

            if (device === "mobile") {
                alert("Mobile wallpapers will open here.");
            }

            if (device === "laptop") {
                alert("Laptop wallpapers will open here.");
            }

            if (device === "pc") {
                alert("PC wallpapers will open here.");
            }

        }

    </script>

</body>
              </html>
